name: Deploy to EKS

on:
  workflow_dispatch:   # allows manual trigger
  push:
    branches:
      - main

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Configure AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # 3. Configure kubectl for EKS
    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig --name my-cluster --region us-east-1

    # 4. Deploy to Kubernetes
    - name: Deploy to EKS
      run: |
        # Update the image in your deployment to the latest one you just pushed
        kubectl set image deployment/fastapi-deployment fastapi-container=126202968095.dkr.ecr.us-east-1.amazonaws.com/fastapi-app:latest --record
        # Wait for the rollout to finish so the deployment is fully updated
        kubectl rollout status deployment/fastapi-deployment